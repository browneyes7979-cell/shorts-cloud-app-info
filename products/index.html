<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>영상 속 상품 찾기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172030;font:16px/1.6 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:20px 16px 40px}.disclosure{margin:0 0 22px;background:#fff4d8;border:1px solid #c89b32;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6}h1{font-size:28px;letter-spacing:-1px;margin:0 0 7px}.intro{color:#536174;margin:0 0 18px}label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px 14px;font:inherit;border:1px solid #94a3b8;border-radius:10px;background:#fff}#status{font-size:13px;color:#536174;margin:13px 0}ul{padding:0;list-style:none;display:grid;gap:14px}li{background:#fff;border:1px solid #dfe4ec;border-radius:15px;padding:17px;overflow-wrap:anywhere}.top{display:flex;align-items:center;gap:9px;margin-bottom:13px}.number{background:#183f97;color:#fff;font-size:20px;font-weight:800;padding:3px 12px;border-radius:8px;letter-spacing:.5px}.new{color:#08734d;background:#e8f6ee;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}.product{display:grid;grid-template-columns:100px 1fr;gap:15px;align-items:center}.photo{width:100px;height:112px;object-fit:contain;border-radius:9px;background:#fafbfc}.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:9px;font-size:12px;color:#66758b;border:1px solid #edf0f5}h2{font-size:17px;line-height:1.6;margin:0;font-weight:750}.buy{display:block;text-align:center;margin-top:16px;padding:12px 10px;background:#183f97;color:#fff;border-radius:9px;text-decoration:none;font-weight:750}.buy:hover{background:#102e70}details{margin-top:11px;font-size:12px;color:#66758b}summary{cursor:pointer}.code{font-size:11px;margin:8px 0 0}.note{font-size:12px;color:#66758b;margin:16px 0}a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ac5b00;outline-offset:3px}.preview{padding:10px;background:#ffe3ba;color:#6b3500;text-align:center;font-size:14px;font-weight:700}@media(max-width:360px){.product{grid-template-columns:82px 1fr;gap:10px}.photo{width:82px;height:100px}h2{font-size:16px}}
</style></head><body><main>
<p class="disclosure">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<h1>영상 속 상품 찾기</h1><p class="intro">영상에서 본 <strong>상품번호</strong>로 찾으세요.</p>
<label for="search">상품번호 또는 상품명</label><input id="search" type="search" autocomplete="off" inputmode="search" placeholder="예: 004 또는 물티슈">
<p id="status" role="status" aria-live="polite">상품 목록을 불러오는 중입니다.</p><ul id="list" aria-label="상품 목록"></ul>
<p class="note">가격·재고·판매 조건은 쿠팡에서 확인하세요. 상품번호는 고정이며, 목록은 최근 등록순입니다. 기존 영상의 상품명·긴 CP 코드로도 검색할 수 있습니다.</p>
<noscript>상품 검색에는 자바스크립트가 필요합니다.</noscript></main><script>
'use strict';
const input=document.getElementById('search'),list=document.getElementById('list'),status=document.getElementById('status');let products=[];
function valid(p){if(!p||typeof p!=='object'||Object.keys(p).sort().join(',')!=='affiliate_url,code,item_id,name,product_id,vendor_item_id')return false;const ids=['product_id','item_id','vendor_item_id'];if(ids.some(k=>typeof p[k]!=='string'||!/^[1-9][0-9]{0,19}$/.test(p[k])))return false;if(p.code!=='CP-'+ids.map(k=>p[k]).join('-')||typeof p.name!=='string'||!p.name.trim()||p.name.length>500||/[<>\x00-\x1f\x7f]/.test(p.name))return false;if(typeof p.affiliate_url!=='string'||p.affiliate_url.length>3000||/[<>\s\\]/.test(p.affiliate_url))return false;try{const u=new URL(p.affiliate_url),allowed=new Set(['lptag','subid','subId','subparam','pageKey','itemId','vendorItemId','traceid','impressionid','pageid','tsource','pt','slot','requestid','channel','landingType','wPcid','wRef','wTime','sourceType','addtag','itime','mcid']);for(const k of u.searchParams.keys())if(!allowed.has(k)||u.searchParams.getAll(k).length!==1)return false;if(u.protocol!=='https:'||u.host!=='link.coupang.com'||u.username||u.password||u.pathname!=='/re/AFFSDPWW'||u.hash)return false;return Object.entries({pageKey:p.product_id,itemId:p.item_id,vendorItemId:p.vendor_item_id,lptag:'AF0973222'}).every(([k,v])=>u.searchParams.getAll(k).length===1&&u.searchParams.get(k)===v);}catch{return false;}}
function validRegistry(d){if(!d||Object.keys(d).sort().join(',')!=='entries,schema_version'||d.schema_version!==1||!Array.isArray(d.entries)||d.entries.length>1000)return false;const codes=new Set(),numbers=new Set();return d.entries.every(e=>{if(!e||Object.keys(e).sort().join(',')!=='code,number,photo_path,photo_sha256'||typeof e.code!=='string'||!/^CP-[1-9][0-9]{0,19}-[1-9][0-9]{0,19}-[1-9][0-9]{0,19}$/.test(e.code)||!Number.isInteger(e.number)||e.number<1||e.number>1000||codes.has(e.code)||numbers.has(e.number))return false;codes.add(e.code);numbers.add(e.number);if(e.photo_path===null&&e.photo_sha256===null)return true;return typeof e.photo_sha256==='string'&&/^[0-9a-f]{64}$/.test(e.photo_sha256)&&['png','jpg','webp'].some(ext=>e.photo_path==='images/'+e.photo_sha256+'.'+ext);});}
function entriesFor(catalog,registry){if(!catalog||Object.keys(catalog).sort().join(',')!=='products,schema_version,status'||catalog.schema_version!==1||!['ready','setup-only'].includes(catalog.status)||!Array.isArray(catalog.products)||catalog.products.length>1000||!catalog.products.every(valid)||new Set(catalog.products.map(p=>p.code)).size!==catalog.products.length||!validRegistry(registry))throw Error('Invalid exact product mapping');const map=new Map(registry.entries.map(e=>[e.code,e]));return catalog.products.map(p=>({...p,navigation:map.get(p.code)||null})).sort((a,b)=>(b.navigation?.number||0)-(a.navigation?.number||0));}
function matches(p,query){const q=query.trim().toLocaleLowerCase('ko');if(!q)return true;const numeric=q.match(/^#?(\d{1,4})\s*번?$/);return numeric?p.navigation?.number===Number(numeric[1]):(p.name+' '+p.code).toLocaleLowerCase('ko').includes(q);}
function placeholder(){const box=document.createElement('div');box.className='photo placeholder';box.textContent='영상 원본 사진 준비 중';return box;}
function render(){list.replaceChildren();const found=products.filter(p=>matches(p,input.value));status.textContent=products.length?(found.length?found.length+'개 상품 · 최근 등록순':'일치하는 상품이 없습니다. 상품번호 또는 상품명을 확인하세요.'):'아직 등록된 상품이 없습니다.';for(const p of found){const li=document.createElement('li'),top=document.createElement('div'),number=document.createElement('span'),product=document.createElement('div'),h=document.createElement('h2'),a=document.createElement('a'),details=document.createElement('details'),summary=document.createElement('summary'),code=document.createElement('p');top.className='top';number.className='number';number.textContent=p.navigation?String(p.navigation.number).padStart(3,'0')+'번':'번호 준비 중';top.append(number);if(p===products[0]){const latest=document.createElement('span');latest.className='new';latest.textContent='최근 등록';top.append(latest);}product.className='product';let photo=placeholder();if(p.navigation?.photo_path){photo=document.createElement('img');photo.className='photo';photo.src='./'+p.navigation.photo_path;photo.alt=p.name;photo.loading='lazy';photo.width=100;photo.height=112;photo.addEventListener('error',()=>photo.replaceWith(placeholder()),{once:true});}h.textContent=p.name;product.append(photo,h);a.className='buy';a.textContent='쿠팡에서 구성·가격 확인';a.href=p.affiliate_url;a.rel='sponsored noopener noreferrer';summary.textContent='정확한 상품코드 확인';code.className='code';code.textContent=p.code;details.append(summary,code);li.append(top,product,a,details);list.append(li);}}
input.addEventListener('input',render);
function loadJson(url){return fetch(url,{cache:'no-store',credentials:'omit'}).then(r=>{if(!r.ok)throw Error('Load failed');return r.text();}).then(text=>{if(text.length>2000000)throw Error('Too large');return JSON.parse(text);});}
Promise.all([loadJson('./products.json'),loadJson('./navigation.json')]).then(([catalog,registry])=>{products=entriesFor(catalog,registry);render();}).catch(()=>{status.textContent='상품 목록 갱신 중이거나 연결이 지연되고 있습니다. 잠시 후 다시 확인해 주세요.';});
</script></body></html>
