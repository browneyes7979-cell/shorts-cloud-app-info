<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>상품 링크 모음</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#172030;font:17px/1.65 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px 18px}.disclosure{background:#fff1cd;border:2px solid #8d6400;padding:16px;border-radius:12px;font-weight:650}h1{font-size:clamp(26px,6vw,38px)}input{width:100%;padding:14px;font:inherit;border:2px solid #64748b;border-radius:8px}ul{padding:0;list-style:none}li{background:white;border:1px solid #cbd5e1;border-radius:12px;margin:16px 0;padding:20px;overflow-wrap:anywhere}h2{font-size:20px}a{display:inline-block;padding:12px 16px;background:#1746a2;color:white;border-radius:8px}a:focus-visible,input:focus-visible{outline:3px solid #9b4d00;outline-offset:4px}.code{font-size:14px;color:#475569}</style></head><body><main><p class="disclosure">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p><h1>상품 링크 모음</h1><p>상품명 또는 상품 코드를 검색하세요. 가격과 판매 조건은 판매 페이지에서 확인하세요.</p><label for="search">상품명 · 상품 코드</label><input id="search" type="search" autocomplete="off" placeholder="상품명 또는 CP-코드"><p id="status" role="status" aria-live="polite">상품 목록을 불러오는 중입니다.</p><ul id="list" aria-label="상품 목록"></ul><noscript>상품 검색에는 자바스크립트가 필요합니다.</noscript></main><script>
'use strict';const input=document.getElementById('search'),list=document.getElementById('list'),status=document.getElementById('status');let products=[];
function valid(p){if(!p||typeof p!=='object'||Object.keys(p).sort().join(',')!=='affiliate_url,code,item_id,name,product_id,vendor_item_id')return false;const ids=['product_id','item_id','vendor_item_id'];if(!p||ids.some(k=>typeof p[k]!=='string'||!/^[1-9][0-9]{0,19}$/.test(p[k])))return false;
if(p.code!=='CP-'+ids.map(k=>p[k]).join('-')||typeof p.name!=='string'||!p.name.trim()||p.name.length>500||/[<>\x00-\x1f\x7f]/.test(p.name))return false;
if(typeof p.affiliate_url!=='string'||p.affiliate_url.length>3000||/[<>\s\\]/.test(p.affiliate_url))return false;
try{const u=new URL(p.affiliate_url);const allowed=new Set(['lptag','subid','subId','subparam','pageKey','itemId','vendorItemId','traceid','impressionid','pageid','tsource','pt','slot','requestid','channel','landingType','wPcid','wRef','wTime','sourceType','addtag','itime','mcid']);for(const key of u.searchParams.keys()){if(!allowed.has(key)||u.searchParams.getAll(key).length!==1)return false;}if(u.protocol!=='https:'||u.host!=='link.coupang.com'||u.username||u.password||u.pathname!=='/re/AFFSDPWW'||u.hash)return false;return Object.entries({pageKey:p.product_id,itemId:p.item_id,vendorItemId:p.vendor_item_id,lptag:'AF0973222'}).every(([k,v])=>u.searchParams.getAll(k).length===1&&u.searchParams.get(k)===v);}catch{return false;}}
function render(){list.replaceChildren();const q=input.value.trim().toLocaleLowerCase('ko');const found=products.filter(p=>(p.name+' '+p.code).toLocaleLowerCase('ko').includes(q));status.textContent=products.length?(found.length+'개 상품'):'준비 중입니다. 아직 등록된 상품이 없습니다.';for(const p of found){const li=document.createElement('li'),h=document.createElement('h2'),code=document.createElement('p'),a=document.createElement('a');h.textContent=p.name;code.className='code';code.textContent=p.code;a.textContent='쿠팡에서 상품 보기';a.href=p.affiliate_url;a.rel='sponsored noopener noreferrer';li.append(h,code,a);list.append(li);}}
input.addEventListener('input',render);fetch('./products.json',{cache:'no-store',credentials:'omit'}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(d=>{if(!d||Object.keys(d).sort().join(',')!=='products,schema_version,status'||d.schema_version!==1||!['ready','setup-only'].includes(d.status)||!Array.isArray(d.products)||d.products.length>1000||!d.products.every(valid)||new Set(d.products.map(p=>p.code)).size!==d.products.length)throw Error();products=d.products;render();}).catch(()=>{status.textContent='상품 목록을 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.';});
</script></body></html>
